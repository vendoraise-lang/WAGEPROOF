# Deployment template only. No service has been created or published.
services:
  - type: web
    name: proposal-preflight
    runtime: node
    plan: free
    buildCommand: npm run check
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: PUBLIC_BASE_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: APP_SECRET
        sync: false
      - key: METRICS_TOKEN
        sync: false
      - key: TRUST_PROXY
        value: "false"
      - key: PAYMENT_MODE
        value: test
      - key: LIVE_PAYMENTS_APPROVED
        value: "false"
      - key: BUSINESS_JURISDICTION
        value: Morocco
      - key: OPERATOR_NAME
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
